# 워크스페이스(PRD_28 §3) : 루트 패키지 = cafe.pi(이동 없음), 공용 패키지 packages/*, 사이트 앱 sitemap/<도메인>.pi
packages:
  - 'packages/*'
  - 'sitemap/*'
  - '!sitemap/_template'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  msw: true
  sharp: true
  # sodium-native: stellar-sdk(pi-backend)의 optional 네이티브 가속 — 미빌드 시 순수 JS(tweetnacl) 폴백.
  # 네이티브 컴파일 회피(Windows·Vercel 빌드 안정성) 위해 false.
  sodium-native: false
  unrs-resolver: true
patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
