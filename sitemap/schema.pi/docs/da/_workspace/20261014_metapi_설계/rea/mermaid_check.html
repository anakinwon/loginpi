<!doctype html><html><body><pre id="out">pending</pre><script src="blocks.js"></script><script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script><script>(async()=>{const r=[];for(const [i,b] of window.B.entries()){try{const k=await mermaid.parse(b);r.push("block "+i+": OK "+(k&&k.diagramType))}catch(e){r.push("block "+i+": ERROR "+String(e.message||e).slice(0,300))}}document.getElementById("out").textContent=r.join(" | ")})()</script></body></html>
